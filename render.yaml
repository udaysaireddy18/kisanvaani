services:
  - type: web
    name: kisanvaani
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////tmp/kisanvaani/kisanvaani.db
      - key: MEDIA_DIR
        value: /tmp/kisanvaani/media
      - key: PDF_DIR
        value: /tmp/kisanvaani/generated_pdfs
